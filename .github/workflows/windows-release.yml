name: Build Windows EXE Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x86'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt }

      - name: Build Unit Forge
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name War2UnitForge --collect-all forge_engine --add-data "profiles;profiles" --add-data "examples;examples" unit_forge.py
          Get-FileHash dist\War2UnitForge.exe -Algorithm SHA256 | Format-List

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.5.0
          TITLE: War2 Unit Forge 0.5.0 Runtime - Windows EXE
        run: |
          $asset = "dist\War2UnitForge.exe"
          $notes = "Portable 32-bit Windows runtime Unit Forge built from the current source. Supports the multi-unit runtime registry and editable unit-data targets without permanently modifying Warcraft II.exe."
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $asset --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:TAG $asset --target $env:GITHUB_SHA --title $env:TITLE --notes $notes --repo $env:GITHUB_REPOSITORY
          }
